{% extends 'Todo/base.html' %}
{% block content %}
<h2>{% if task %}Edit{% else %}Add{% endif %} Task </h2>

{% if error %}<div class="alert alert-danger">{{error}}

</div>
{% endif%}
<form method="POST" >
    {% csrf_token %}
    <div class="mb-3">
        <label for='title' class=' form-label'>Title</label>
        <input type='text' class='form-control' name='title' id='title' value = " {{ task.title|default_if_none:' ' }} " >
    </div>
    <div class="mb-3">
        <label for='description' class=' form-label'>Description</label>
        <textarea type='text' class='form-control' name='description' rows="3" id='description' >{{ task.description|default_if_none:' ' }}</textarea>
    </div>
    <button type='submit' class='btn btn-primary'>Save</button>
    <a href="{% url 'Todo:task_list' %}" class='btn btn-secondary'>Cancel</a>

</form>

    

    
{% endblock %}
